<!doctype html>
<!-- Source for public/og-image.png. Regenerate with: npm run og-image -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Manrope; src: url('../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2'); font-weight: 200 800; }
  @font-face { font-family: Inter; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
  @font-face { font-family: Mono; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box; padding: 72px 80px; background: #171717; color: #f7f6f2;
    font-family: Inter, sans-serif; display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .mark { font-family: Manrope; font-weight: 800; font-size: 44px; letter-spacing: -0.05em; }
  .mark span { color: #d4ff70; }
  .label { font-family: Mono; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: #b5b5b5; display: flex; align-items: center; gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #d4ff70; }
  h1 { margin: 0; font-family: Manrope; font-weight: 800; font-size: 84px; line-height: 1.04; letter-spacing: -0.045em; max-width: 900px; }
  h1 span { background: linear-gradient(#d4ff70, #d4ff70) no-repeat 0 92% / 100% 0.12em; }
  .foot { display: flex; justify-content: space-between; border-top: 1px solid #393939; padding-top: 28px; font-size: 24px; color: #b5b5b5; }
  .foot strong { color: #f7f6f2; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">bf<span>.</span></div>
    <div class="label"><i class="dot"></i>Software developer · Ethiopia</div>
  </div>
  <h1>I build software that solves <span>real problems.</span></h1>
  <div class="foot"><strong>Bilal Ferej</strong><span>bilalferej.com</span></div>
</body>
</html>
